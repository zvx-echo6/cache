# Temporary (removed before merge): repeats the test files that failed intermittently, idle and under CPU load.
name: Flaky check

on:
  push:
    branches: [rel-30-regions]

permissions:
  contents: read

jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Packages
        working-directory: app
        run: flutter pub get
      - name: The three files 10 times, then the whole app suite 4 times (where the failures happened)
        working-directory: app
        run: |
          FILES="test/regions_test.dart test/models_screen_test.dart test/search_model_ui_test.dart"
          fails=0
          for i in $(seq 1 10); do
            if flutter test --no-pub $FILES > run.log 2>&1; then echo "files $i: pass"; else
              fails=$((fails+1)); echo "files $i: FAIL"; grep -E "Expected:|Actual:|\[E\]|FAILED|failed\)" run.log | head -20; fi
          done
          for i in 1 2 3 4; do
            if flutter test --no-pub > run.log 2>&1; then echo "suite $i: pass ($(grep -c '✅' run.log || true) passed)"; else
              fails=$((fails+1)); echo "suite $i: FAIL"; grep -E "Expected:|Actual:|tests passed|failed\)" run.log | head -20; fi
          done
          echo "failures: $fails of 14"
          [ "$fails" = 0 ]
