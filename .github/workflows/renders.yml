# Golden renders of the app's screens for review, drawn by the app's own widgets (app/test_shots), uploaded as an artifact so a
# builder reads them without a shared build machine. Runs on a push to a branch named renders-*, rel-29-dl or rel-30, or by hand with
# the test files to run (default: every file in app/test_shots). Nothing is published anywhere else; no secrets are used.
# Guide pictures: run it by hand with guide=true (gh workflow run renders.yml --ref <branch> -f guide=true). It draws
# test_shots/guide_shots_test.dart, cuts the pictures with tools/guide/make_shots.py into app/assets/guide/shots/ (regions-sheet
# is made by hand and left as it is) and uploads them as the artifact guide-shots-<sha>, ready to commit on the branch.
# The Maps pictures have a real map behind the screen (tools/guide/README.md, "The map pictures"): the guide test first writes
# what each map shows, tools/guide/maps/render.mjs draws it with MapLibre GL JS in the runner's own Chrome (Node and two pinned
# npm packages, in this path only), and the draw puts the pictures behind the screens. The renderer reads map tiles from the
# app's own published sources and the public elevation tiles, counts its requests and fails above a fixed ceiling.
name: Renders

on:
  push:
    branches: [rel-29-dl, rel-30, 'renders-*']
    paths: ['app/**', '.github/workflows/renders.yml']
  workflow_dispatch:
    inputs:
      tests:
        description: 'Test files under app/ to run (space separated), e.g. test_shots/downloads_renders_test.dart'
        required: false
        default: 'test_shots/downloads_renders_test.dart'
      guide:
        description: 'Make the guide pictures (draws test_shots/guide_shots_test.dart, ignores tests)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: renders-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  renders:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rel-1.1') }}
      - name: Packages
        working-directory: app
        run: flutter pub get
      # PDFium and SQLite for the app's build hooks, from the Actions cache instead of GitHub releases.
      - name: PDFium and SQLite (pinned, from the Actions cache)
        id: native
        uses: ./.github/actions/pinned-downloads
        with:
          names: pdfium-chromium-7811-linux-x64.tgz sqlite3-3.5.2-libsqlite3.x64.linux.so
      - name: Seed the build hooks
        run: bash .github/scripts/seed-native-assets.sh "${{ steps.native.outputs.dir }}" app linux-x64
      # ---- the guide's map pictures: scenes, then their pictures (the draw below shows them where the map is) ----
      - name: Map renderer packages
        if: ${{ github.event.inputs.guide == 'true' }}
        working-directory: tools/guide/maps
        run: |
          node --version
          # Until package-lock.json is committed, this run writes it (it is in the guide-maps artifact); from then on the
          # packages are exactly the locked ones.
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Write the map scenes
        if: ${{ github.event.inputs.guide == 'true' }}
        working-directory: app
        env:
          GUIDE_MAPS: export
        run: flutter test --no-pub --update-goldens test_shots/guide_shots_test.dart
      - name: Render the maps
        if: ${{ github.event.inputs.guide == 'true' }}
        env:
          # The first runs of the renderer: what the map itself reports is printed, and does not stop the pictures.
          GUIDE_MAPS_MAP_ERRORS: warn
        run: node tools/guide/maps/render.mjs
      - name: Draw the renders
        working-directory: app
        env:
          TESTS: ${{ (github.event.inputs.guide == 'true' && 'test_shots/guide_shots_test.dart') || github.event.inputs.tests || (github.ref_name == 'rel-30' && 'test_shots/desktop_renders_test.dart') || 'test_shots/linux_ux_renders_test.dart' }}
        run: |
          # shellcheck disable=SC2086
          flutter test --no-pub --update-goldens $TESTS
      - name: Upload the renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders-${{ github.sha }}
          # crops.json: where tools/guide/make_shots.py cuts each guide picture (written by guide_shots_test.dart)
          path: |
            app/test_shots/*/*.png
            app/test_shots/guide/crops.json
          if-no-files-found: warn
          retention-days: 14
      - name: Cut the guide pictures
        if: ${{ github.event.inputs.guide == 'true' }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends python3-pil
          python3 -I tools/guide/make_shots.py
          git status --short app/assets/guide/shots
      - name: Upload the guide pictures
        if: ${{ github.event.inputs.guide == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: guide-shots-${{ github.sha }}
          path: app/assets/guide/shots/*.png
          if-no-files-found: error
          retention-days: 14
      # The rendered maps with their lock file, the scenes they were rendered from (and the renderer's report), and the
      # pictures cut for comparing two versions of a view. Uploaded after a failure too, to see what the renderer made.
      - name: Upload the map pictures
        if: ${{ always() && github.event.inputs.guide == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: guide-maps-${{ github.sha }}
          path: |
            app/test_shots/guide_maps/
            app/test_shots/guide/scenes/
            app/test_shots/guide/compare/
            tools/guide/maps/package-lock.json
          if-no-files-found: warn
          retention-days: 14
