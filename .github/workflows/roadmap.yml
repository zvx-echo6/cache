# Rebuilds cached.info/roadmap (from the public "Cache roadmap" GitHub project) and cached.info/features
# (from docs/features.yml), hourly and on demand. Each page is uploaded only when it changed (compared with the stored object's MD5), and never uploads if the
# generator finds a blocked word (the generators in tools/site stop before writing anything).
#
# Secrets:
#   ROADMAP_GH_TOKEN   read-only access to user projects (the built-in token cannot read them). Until it exists, runs skip.
#   ROADMAP_BLOCKLIST  words that must never reach the public page (kept out of this public file).
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT   an R2 key limited to the cached-site bucket.
name: Roadmap page

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roadmap-page
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.ROADMAP_GH_TOKEN }}
      ROADMAP_BLOCKLIST: ${{ secrets.ROADMAP_BLOCKLIST }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Check secrets
        id: ready
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::notice::ROADMAP_GH_TOKEN is not set yet; skipping."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          for v in ROADMAP_BLOCKLIST AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ENDPOINT; do
            if [ -z "${!v}" ]; then echo "::error::$v is missing"; exit 1; fi
          done
          echo "go=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'true'
      - name: Generate
        if: steps.ready.outputs.go == 'true'
        run: |
          python3 -m pip install --quiet pyyaml==6.0.2
          python3 tools/site/gen_roadmap.py roadmap.html
          python3 tools/site/gen_features.py docs/features.yml features.html
      - name: Upload what changed
        if: steps.ready.outputs.go == 'true'
        run: |
          for page in roadmap.html features.html; do
            new=$(md5sum "$page" | cut -d' ' -f1)
            old=$(aws s3api head-object --endpoint-url "$R2_ENDPOINT" --bucket cached-site --key "$page" \
                    --query ETag --output text 2>/dev/null | tr -d '"' || true)
            if [ "$new" = "$old" ]; then echo "$page unchanged."; continue; fi
            aws s3 cp "$page" "s3://cached-site/$page" --endpoint-url "$R2_ENDPOINT" \
              --content-type 'text/html; charset=utf-8' --cache-control 'public, max-age=300' --only-show-errors
            echo "Uploaded $page."
          done
