# TEMPORARY proof run for the library_ffi keyword flake (an index check taking the build guard exclusive); removed before merge.
name: Keyword probe repeat
on:
  push:
    branches: [bookshelves-app]
    paths: ['packages/cache_search/native/cache_search/src/index.rs', '.github/workflows/kwprobe-repeat.yml']
permissions:
  contents: read
env:
  RUST_VERSION: 1.99.1
  CARGO_INCREMENTAL: '0'
jobs:
  repeat:
    strategy:
      fail-fast: false
      matrix:
        code: [fixed, old]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: packages/cache_search/native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Pinned libzim
        uses: ./.github/actions/libzim-prebuilt
        with:
          arch: x86_64
      - run: echo "LD_LIBRARY_PATH=$(dirname "$(ls "$LIBZIM_DIR"/lib/*/libzim.so)")" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/cache_search/native -> target
          key: kwprobe-repeat
      - name: Old code (rel-1.1 base), for comparison only
        if: matrix.code == 'old'
        run: git checkout 49f937fa -- cache_search/src/index.rs
      - name: The four tests that share one keyword index, x300 (in parallel each time)
        run: |
          cargo test --locked -p cache_search --test library_ffi --no-run
          bin=$(cargo test --locked -p cache_search --test library_ffi --no-run --message-format=json | jq -r 'select(.executable != null and .target.name=="library_ffi") | .executable' | tail -n1)
          test -x "$bin"
          fails=0
          for i in $(seq 1 300); do "$bin" identical_points keyword_query keyword_and_vector keyword_source -q > "$RUNNER_TEMP/out.txt" 2>&1 || { fails=$((fails+1)); grep -m1 -A2 panicked "$RUNNER_TEMP/out.txt"; }; done
          echo "${{ matrix.code }}: $fails failures in 300 runs"
          if [ "${{ matrix.code }}" = fixed ]; then test "$fails" -eq 0; fi
      - name: Unit tests of the check (fixed only)
        if: matrix.code == 'fixed'
        run: cargo test --locked -p cache_search --lib index::tests -- --test-threads 8
