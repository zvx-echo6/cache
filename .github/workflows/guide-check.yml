name: Guide check

# The guide quotes the app's labels and the assistant is pointed at the guide's titles: both must match the app. And every
# data source the guide or What's new names (tools/guide/sources_expected.txt) must be in the live connector catalogue: a
# release must not promise a source whose data is not published (the check warns, and passes, when the catalogue cannot be
# read).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Labels and guide titles
        run: python3 -I tools/guide/ci_check.py
      - name: Named data sources are published
        run: python3 -I tools/guide/sources_check.py
