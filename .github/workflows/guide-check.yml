name: Guide check

# The guide quotes the app's labels and the assistant is pointed at the guide's titles: both must match the app.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Labels and guide titles
        run: python3 -I tools/guide/ci_check.py
