# Builds Cache for Android, signs the App Bundle with the Play upload key and sends it to Google Play's internal, closed (alpha)
# and open (beta) testing tracks, fully rolled out with nothing left to click in Play Console (or as a draft with status: draft).
# Manual trigger only. It builds the branch it is started on.
# android_auto: builds with Android Auto switched on (off in every normal build), to start Google's car review. Such a build may
# only go to closed testing (tracks: alpha), where the car review blocks nothing; the run fails at the start on any other tracks.
#
# Signing: the upload key (PKCS12 keystore, alias "upload") lives only in the Actions secrets ANDROID_UPLOAD_KEYSTORE_B64,
# ANDROID_UPLOAD_STORE_PASSWORD, ANDROID_UPLOAD_KEY_PASSWORD and ANDROID_UPLOAD_KEY_ALIAS. It is decoded into the runner's temp
# folder for the build, named in app/android/key.properties (as on a local release build), and removed afterwards; it is never
# uploaded as an artifact. PLAY_SERVICE_ACCOUNT_JSON is the Google Play Developer API service account (upload).
#
# Native parts:
#   routing  Valhalla 3.7.0 + the C shim, libvalhalla_shim.so for arm64-v8a (cached; the app finds it in its native library folder)
#   app      flutter build appbundle: Gradle builds the Rust search core with cargo-ndk (arm64-v8a, with libzim) and llama.cpp
#            with the NDK (arm64-v8a); Rust, libzim and Gradle are cached
#   play     upload to Play, only the new release on each track (anything halted, staged or drafted cleared), with the chosen
#            status and the release notes, commit, then read every track back and fail unless each shows the new release
name: Android Play

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes (en-US, at most 500 characters)
        type: string
        required: true
      tracks:
        description: Play tracks, comma separated (internal = internal testing, alpha = closed testing, beta = open testing)
        type: string
        default: internal,alpha,beta
      status:
        description: Release status (completed = fully rolled out on every track, anything halted or drafted there cleared; draft = a dry run, uploaded, not sent)
        type: choice
        options: [completed, draft]
        default: completed
      android_auto:
        description: Build with Android Auto switched on, for Google's car review (closed testing only, tracks must be alpha)
        type: boolean
        default: false
  # Only so GitHub lists this workflow while it is not on the default branch (a manual run needs that): a push builds nothing.
  push:
    branches: [android-play]

concurrency:
  group: android-play
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.happylittlellc.cache
  FLUTTER_VERSION: 3.44.8
  NDK_VERSION: 28.2.13676358
  CARGO_NDK_VERSION: 4.1.2
  # The Rust toolchain, pinned like tests.yml and native-libs.yml.
  RUST_VERSION: 1.99.1

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      build_name: ${{ steps.v.outputs.build_name }}
      build_number: ${{ steps.v.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            app/pubspec.yaml
            app/lib/version.dart
            app/android/play_release.py
            app/android/play_release_test.py
      - name: The upload script's tests (a fake Play)
        run: python3 -I app/android/play_release_test.py
      - name: Check signing and upload configuration
        env:
          ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          for key in ANDROID_UPLOAD_KEYSTORE_B64 ANDROID_UPLOAD_STORE_PASSWORD ANDROID_UPLOAD_KEY_PASSWORD ANDROID_UPLOAD_KEY_ALIAS PLAY_SERVICE_ACCOUNT_JSON; do
            if [[ -z "${!key}" ]]; then echo "::error::Missing required secret: $key"; exit 1; fi
          done
          echo "Required configuration is present (secret values are not logged)."
      - name: Release notes and tracks
        env:
          NOTES: ${{ inputs.release_notes }}
          TRACKS: ${{ inputs.tracks }}
        run: |
          python3 -I - <<'PY'
          import os, sys
          notes, tracks = os.environ["NOTES"].strip(), os.environ["TRACKS"].replace(" ", "")
          if not notes: sys.exit("::error::The release notes are empty")
          if len(notes) > 500: sys.exit(f"::error::The release notes are {len(notes)} characters; Play allows at most 500")
          import re
          if not re.fullmatch(r"[A-Za-z0-9:_-]+(,[A-Za-z0-9:_-]+)*", tracks): sys.exit(f"::error::Not a list of track names: {tracks}")
          print(f"tracks {tracks}, release notes {len(notes)} characters")
          PY
      # Google reviews a car build without blocking anything only on closed testing; on open testing it would block releases.
      - name: An Android Auto build goes to closed testing only
        if: inputs.android_auto
        env:
          TRACKS: ${{ inputs.tracks }}
        run: |
          tracks=$(printf '%s' "$TRACKS" | tr -d '[:space:]')
          if [[ "$tracks" != "alpha" ]]; then
            echo "::error::An Android Auto build may only go to closed testing (alpha) for now; tracks is '$tracks'. Run it again with tracks: alpha"
            exit 1
          fi
          echo "Android Auto build, closed testing (alpha) only"
      # pubspec.yaml's "version: 1.0.30+31" is the version shown, 1.0.30, and versionCode 31, the same build number on iPhone and
      # Android. The build number is its own counter: every upload needs a higher one (a test build and the release of the same
      # version are two builds), so it is not tied to the version's last number. It is the versionCode Play gets (not the run
      # number), and the next step checks it is higher than every one already on Play.
      - name: Version and versionCode from pubspec.yaml
        id: v
        # Also fails when app/lib/version.dart has a different version or build number, or the build number is 1000 or more.
        run: bash .github/scripts/app-version.sh --store
      - name: The versionCode is higher than every one on Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 -I app/android/play_release.py --check-newer "${{ steps.v.outputs.build_number }}"

  routing:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          command -v ninja > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ninja-build; }
      - name: Native toolchain identity
        id: toolchain
        run: |
          echo "id=$( { cat "$ANDROID_NDK_HOME/source.properties"; cmake --version; ninja --version; uname -m; lsb_release -rs; } | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Finished library cache
        id: out
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/routing-out
          key: routing-android-v1-${{ steps.toolchain.outputs.id }}-${{ hashFiles('packages/valhalla/**') }}
      - name: Free disk space
        if: steps.out.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Valhalla source and dependency cache
        id: routing-cache
        if: steps.out.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/valhalla/downloads
            ~/.cache/vcpkg/archives
          key: valhalla-android-v1-${{ steps.toolchain.outputs.id }}-${{ hashFiles('packages/valhalla/vcpkg.json', 'packages/valhalla/triplets/**') }}
      - name: Build Valhalla and the shim
        if: steps.out.outputs.cache-hit != 'true'
        run: bash packages/valhalla/scripts/build-android.sh "$RUNNER_TEMP/valhalla" "$RUNNER_TEMP/routing-out"
      - name: Save Valhalla dependencies
        if: (always() && steps.out.outputs.cache-hit != 'true' && steps.routing-cache.outputs.cache-hit != 'true' && steps.routing-cache.outputs.cache-primary-key != '') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rel-1.1')
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/valhalla/downloads
            ~/.cache/vcpkg/archives
          key: ${{ steps.routing-cache.outputs.cache-primary-key }}
      - run: cat "$RUNNER_TEMP/routing-out/valhalla-build.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: native-routing
          path: ${{ runner.temp }}/routing-out/libvalhalla_shim.so
          retention-days: 2

  app:
    needs: [plan, routing]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
          # libzim is fetched by Gradle into a folder outside the repository (fetch-libzim.sh refuses one inside it).
          echo "CACHE_LIBZIM_BUILD_DIR=$RUNNER_TEMP/libzim" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: native-routing
          path: app/android/app/src/main/jniLibs/arm64-v8a
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The Gradle distribution and dependencies, cached by setup-gradle (the wrapper distribution by its version, dependencies
      # restored from the newest entry, not only an exact match of the build files). Every branch writes, as setup-java's cache did.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ !(github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rel-1.1') }}
      # PDFium and SQLite for the app's build hooks (Android ABIs, and Linux for flutter test), from the Actions cache instead of
      # GitHub releases.
      - name: PDFium and SQLite (pinned, from the Actions cache)
        id: native
        uses: ./.github/actions/pinned-downloads
        with:
          names: >-
            pdfium-chromium-7811-linux-x64.tgz pdfium-chromium-7811-android-arm64.tgz
            sqlite3-3.5.2-libsqlite3.x64.linux.so sqlite3-3.5.2-libsqlite3.arm64.android.so
      - name: Seed the build hooks
        run: bash .github/scripts/seed-native-assets.sh "${{ steps.native.outputs.dir }}" app linux-x64 android-arm64
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rel-1.1') }}
      - name: NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Rust for Android
        id: rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add aarch64-linux-android
          echo "id=$( { rustc -vV; cat "$ANDROID_NDK_HOME/source.properties"; } | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          rustc --version
      - name: cargo-ndk cache
        id: cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ env.CARGO_NDK_VERSION }}-${{ steps.rust.outputs.id }}
      - name: Install cargo-ndk
        if: steps.cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
      - name: Cargo registry cache
        id: cache-1
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-home-android-${{ hashFiles('packages/cache_search/native/Cargo.lock') }}
          restore-keys: cargo-home-android-
      - name: Cargo target cache
        id: cache-2
        uses: actions/cache/restore@v4
        with:
          path: packages/cache_search/native/target
          key: cargo-target-android-${{ steps.rust.outputs.id }}-${{ hashFiles('packages/cache_search/native/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: cargo-target-android-${{ steps.rust.outputs.id }}-${{ hashFiles('packages/cache_search/native/Cargo.lock') }}-
      - name: libzim download cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/libzim
          key: libzim-android-9.8.2-1
      - name: Upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties
          keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -storetype PKCS12 -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" 2>/dev/null \
            | sed -n 's/^[[:space:]]*SHA256: *//p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f' > "$RUNNER_TEMP/upload-cert.sha256"
          test -s "$RUNNER_TEMP/upload-cert.sha256" || { echo "::error::The upload keystore did not open with the store password and alias"; exit 1; }
          echo "upload certificate SHA-256: $(cat "$RUNNER_TEMP/upload-cert.sha256")"
      - name: Build the App Bundle
        working-directory: app
        env:
          CACHE_LLAMA_GEMMA4_PREFILL_OPT: 'ON'
          # Android Auto is off unless this is exactly 'true' (app/android/app/build.gradle.kts); 'true' only with the
          # android_auto input.
          ORG_GRADLE_PROJECT_cacheAndroidAuto: ${{ inputs.android_auto && 'true' || 'false' }}
        run: |
          flutter --version
          flutter pub get
          flutter test --no-pub
          flutter build appbundle --release --target-platform android-arm64 --build-name=${{ needs.plan.outputs.build_name }} --build-number=${{ needs.plan.outputs.build_number }}
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/app/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/out/Cache-${{ needs.plan.outputs.build_name }}.aab"
      - name: Verify the signed bundle
        env:
          ANDROID_AUTO: ${{ inputs.android_auto && 'true' || 'false' }}
        run: |
          aab="out/Cache-${{ needs.plan.outputs.build_name }}.aab"
          ls -l "$aab"; sha256sum "$aab"
          unzip -l "$aab" | grep 'base/lib/' | awk '{print $1, $4}'
          for lib in libcache_search.so libvalhalla_shim.so libzim.so libc++_shared.so libcache_icu_data.so libcache_llama.so; do
            unzip -l "$aab" "base/lib/arm64-v8a/$lib" > /dev/null || { echo "::error::$lib is missing from base/lib/arm64-v8a"; exit 1; }
          done
          unzip -p "$aab" base/lib/arm64-v8a/libcache_llama.so > "$RUNNER_TEMP/cache-llama-check.so"
          LC_ALL=C grep -aFq 'cache-gemma4-prefill-31356' "$RUNNER_TEMP/cache-llama-check.so" || { echo "::error::Optimized Gemma engine is missing from the bundle"; exit 1; }
          rm -f "$RUNNER_TEMP/cache-llama-check.so"
          unzip -p "$aab" base/lib/arm64-v8a/libcache_search.so > "$RUNNER_TEMP/cache-core-check.so"
          LC_ALL=C grep -aFq '.cache-search-index.guard' "$RUNNER_TEMP/cache-core-check.so" || { echo "::error::Crash-safe indexing core is missing"; exit 1; }
          rm -f "$RUNNER_TEMP/cache-core-check.so"
          # A car build must never reach a track it should not, and a normal build must never carry Android Auto by accident:
          # the bundle's manifest (protobuf, names as plain text) must declare the car service exactly when android_auto is on.
          unzip -p "$aab" base/manifest/AndroidManifest.xml > "$RUNNER_TEMP/manifest-check.pb"
          test -s "$RUNNER_TEMP/manifest-check.pb" || { echo "::error::The bundle has no base/manifest/AndroidManifest.xml"; exit 1; }
          car=$(LC_ALL=C grep -a -c CacheCarAppService "$RUNNER_TEMP/manifest-check.pb" || true)
          rm -f "$RUNNER_TEMP/manifest-check.pb"
          if [[ "$ANDROID_AUTO" == "true" && "$car" -eq 0 ]]; then echo "::error::android_auto is on but the bundle's manifest has no CacheCarAppService"; exit 1; fi
          if [[ "$ANDROID_AUTO" != "true" && "$car" -ne 0 ]]; then echo "::error::android_auto is off but the bundle's manifest declares CacheCarAppService"; exit 1; fi
          echo "Android Auto in the bundle: $([[ "$car" -ne 0 ]] && echo on || echo off) (android_auto input: $ANDROID_AUTO)"
          signer=$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: *//p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')
          if [[ "$signer" != "$(cat "$RUNNER_TEMP/upload-cert.sha256")" ]]; then
            echo "::error::The bundle is not signed with the upload key (signer $signer)"; exit 1
          fi
          echo "signed with the upload key"
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/upload-cert.sha256" app/android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: Cache-aab
          path: out/*.aab
          retention-days: 14
      - name: Save cache (Cargo registry cache) (main and rel-1.1 only)
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rel-1.1') && steps.cache-1.outputs.cache-primary-key != '' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cache-1.outputs.cache-primary-key }}
      - name: Save cache (Cargo target cache) (main and rel-1.1 only)
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rel-1.1') && steps.cache-2.outputs.cache-primary-key != '' && steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages/cache_search/native/target
          key: ${{ steps.cache-2.outputs.cache-primary-key }}

  play:
    needs: [plan, app]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: app/android/play_release.py
      - uses: actions/download-artifact@v4
        with:
          name: Cache-aab
          path: out
      - name: Upload to Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          TRACKS: ${{ inputs.tracks }}
          RELEASE_STATUS: ${{ inputs.status }}
        # Uploads once, puts the release on every track, commits, then reads every track back and fails the job unless each
        # shows the new release as sent (completed: fully rolled out, alone on the track).
        run: |
          python3 -I app/android/play_release.py "out/Cache-${{ needs.plan.outputs.build_name }}.aab" \
            "${{ needs.plan.outputs.build_number }}" "${{ needs.plan.outputs.build_name }}" "$(printf '%s' "$TRACKS" | tr -d '[:space:]')"
