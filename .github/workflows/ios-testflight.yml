# Builds Cache for iPhone, signs it and (only when `upload` is ticked) sends it to TestFlight, then hands it to the chosen testers:
# the "Public" group by default (export compliance, "What to test", the group, and beta review when one is needed), or only the
# "Family" group for a test build (an internal group that gets every build: export compliance and "What to test", no beta review).
# Manual trigger only: macOS runner minutes cost about 10x Linux on a private repo.
#
# The car screen (CarPlay) is off unless `carplay` is ticked: the app then has no CarPlay entitlement and CarPlay never shows it
# (check-app.sh refuses a signed app whose entitlement does not match the tick box). Ticked, the build can only go to Family.
#
# Signing: a distribution certificate and an App Store provisioning profile made with the App Store Connect API (the account has no
# registered devices, so Xcode's automatic development signing cannot work headless). They live only in the Actions secrets
# IOS_DIST_P12_B64, IOS_DIST_P12_PASSWORD and IOS_PROFILE_B64. ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8_B64 are the API key (upload).
#
# Native parts (all cached, see the cache steps):
#   core   Rust search core (aarch64-apple-ios static library) + Kiwix CoreKiwix.xcframework (libzim, Xapian, ICU with data)
#   llama  llama.cpp with Metal + the chat engine, one static library
#   app    flutter build, xcodebuild archive, export the .ipa
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the .ipa to TestFlight
        type: boolean
        default: false
      ref:
        description: Branch, tag or commit to build (empty = the branch the workflow was started on)
        type: string
        default: ''
      stage:
        description: What to build (core or llama only, to test one native part cheaply)
        type: choice
        options: [all, core, llama]
        default: all
      whats_new:
        description: '"What to test" for the testers (empty = the Unreleased section of CHANGELOG.md)'
        type: string
        default: ''
      group:
        description: Who gets the uploaded build (Public = the public testers, a release; Family = only the internal Family group, a test build)
        type: choice
        options: [Public, Family]
        default: Public
      carplay:
        description: Build with the car screen (CarPlay) on. Its icon then shows on the CarPlay screen of everyone who has the build, so an upload goes to Family only
        type: boolean
        default: false

concurrency:
  group: ios-testflight-${{ github.run_id }}
  cancel-in-progress: false

env:
  TEAM_ID: 7G87LQAK4J
  BUNDLE_ID: com.happylittle.cache
  FLUTTER_VERSION: 3.44.8
  IPHONEOS_DEPLOYMENT_TARGET: '16.3'
  # The Rust toolchain, pinned like tests.yml and native-libs.yml (not the runner image's own).
  RUST_VERSION: 1.99.1

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.p.outputs.stage }}
      upload: ${{ steps.p.outputs.upload }}
      build_name: ${{ steps.v.outputs.build_name }}
      build_number: ${{ steps.v.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          sparse-checkout: |
            .github
            app/pubspec.yaml
            app/lib/version.dart
            packages/cache_search/ios/testflight_public.py
      - name: Validate the source reference
        env:
          SOURCE_REF: ${{ inputs.ref }}
        run: |
          if [[ "$SOURCE_REF" =~ ^[0-9a-fA-F]{7,39}$ ]]; then
            echo "::error::Use a full 40-character commit SHA or a branch/tag name; shortened commit IDs cannot be checked out by this workflow."
            exit 1
          fi
      - name: Check signing and upload configuration
        if: inputs.stage == 'all'
        env:
          IOS_DIST_P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE_B64: ${{ secrets.IOS_PROFILE_B64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          for key in IOS_DIST_P12_B64 IOS_DIST_P12_PASSWORD IOS_PROFILE_B64; do
            if [[ -z "${!key}" ]]; then echo "::error::Missing required signing secret: $key"; exit 1; fi
          done
          if [[ "$UPLOAD" == true ]]; then
            for key in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_B64; do
              if [[ -z "${!key}" ]]; then echo "::error::Missing required upload secret: $key"; exit 1; fi
            done
          fi
          echo "Required configuration is present (secret values are not logged)."
      # The car screen (CarPlay), input `carplay`: the build then claims the CarPlay entitlement (CACHE_CARPLAY=YES picks
      # Runner/RunnerCarPlay.entitlements). Two things are settled here, before any Mac minutes: such a build is never handed to
      # the public testers, and the profile must carry the entitlement (an app that claims one its profile lacks does not sign).
      - name: The car screen build goes to Family only, and its profile carries the CarPlay entitlement
        if: inputs.carplay && inputs.stage == 'all'
        env:
          IOS_PROFILE_B64: ${{ secrets.IOS_PROFILE_B64 }}
          UPLOAD: ${{ inputs.upload }}
          GROUP: ${{ inputs.group || 'Public' }}
        run: |
          if [[ "$UPLOAD" == true && "$GROUP" != Family ]]; then
            echo "::error::A build with the car screen on shows its icon on CarPlay for everyone who has it: upload it to the Family group only."
            exit 1
          fi
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          echo "$IOS_PROFILE_B64" | base64 -d > "$work/profile.mobileprovision"
          if ! openssl smime -inform der -verify -noverify -in "$work/profile.mobileprovision" -out "$work/profile.plist" 2> /dev/null; then
            echo "::warning::The profile could not be read here; the Mac job checks it again before it archives."
            exit 0
          fi
          python3 -I - "$work/profile.plist" <<'PY'
          import plistlib, sys
          entitlements = plistlib.load(open(sys.argv[1], "rb")).get("Entitlements", {})
          if entitlements.get("com.apple.developer.carplay-maps") is not True:
              print("::error::The provisioning profile does not carry com.apple.developer.carplay-maps: a build with the car screen on cannot be signed with it.")
              sys.exit(1)
          print("The profile carries the CarPlay entitlement (its contents are not logged).")
          PY
      # pubspec.yaml's "version: 1.0.30+31" is the version shown, 1.0.30, and build number 31, the same on iPhone and
      # Android. The build number is its own counter: every upload needs a higher one (a test build and the release of the same
      # version are two builds), so it is not tied to the version's last number. It is the build number TestFlight gets (not the run
      # number), and the next step checks it is higher than every one already on TestFlight.
      - name: Version and build number from pubspec.yaml
        id: v
        # Also fails when app/lib/version.dart has a different version or build number, or the build number is 1000 or more.
        run: bash .github/scripts/app-version.sh --store
      - name: The build number is higher than the last TestFlight build
        if: inputs.stage == 'all'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          if [[ -z "$ASC_KEY_ID" || -z "$ASC_ISSUER_ID" || -z "$ASC_KEY_P8_B64" ]]; then
            if [[ "$UPLOAD" == true ]]; then echo "::error::The App Store Connect key is needed to check the build number"; exit 1; fi
            echo "::warning::No App Store Connect key: the build number was not checked against TestFlight."; exit 0
          fi
          python3 -I packages/cache_search/ios/testflight_public.py --check-newer "${{ steps.v.outputs.build_number }}"
      - id: p
        run: |
          echo "stage=${{ inputs.stage }}" >> "$GITHUB_OUTPUT"
          echo "upload=${{ inputs.upload }}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  core:
    needs: plan
    if: needs.plan.outputs.stage == 'all' || needs.plan.outputs.stage == 'core'
    runs-on: macos-26
    # 180: a run on a tag cannot read a branch's caches, so the Rust core builds cold (about 80 minutes).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Preflight native iOS configuration and toolchain
        env:
          EXPECTED_SOURCE: ${{ inputs.ref }}
        run: |
          if [[ "$EXPECTED_SOURCE" =~ ^[0-9a-fA-F]{40}$ ]]; then
            bash packages/valhalla/scripts/preflight-ios.sh "$EXPECTED_SOURCE"
          else
            bash packages/valhalla/scripts/preflight-ios.sh
          fi
      - name: Check the disk-space helper on macOS
        run: |
          env -u IPHONEOS_DEPLOYMENT_TARGET clang -Wall -Wextra -Werror packages/cache_search/ios/Classes/cache_search.c \
            packages/cache_search/ios/tests/free_space_test.c -framework CoreFoundation -o "$RUNNER_TEMP/free-space-test"
          "$RUNNER_TEMP/free-space-test" "$RUNNER_TEMP" "$RUNNER_TEMP/missing-$(uuidgen)"
      - name: Compile the offline reader rules with WebKit
        run: |
          env -u IPHONEOS_DEPLOYMENT_TARGET swift packages/cache_search/ios/tests/reader_rules_test.swift \
            packages/cache_search/ios/tests/offline-reader-rules.json
      - name: Native toolchain identity
        id: toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          echo "id=$( { xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; rustc -vV; cmake --version; ninja --version; uname -m; } | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Finished library cache
        id: out
        uses: actions/cache@v4
        with:
          path: packages/cache_search/ios/native
          key: core-routing-v1-${{ steps.toolchain.outputs.id }}-${{ hashFiles('packages/cache_search/native/**/*.rs', 'packages/cache_search/native/**/Cargo.toml', 'packages/cache_search/native/Cargo.lock', 'packages/cache_search/native/zimx/**', 'packages/cache_search/ios/build-core.sh', 'packages/valhalla/**', '.github/workflows/ios-testflight.yml') }}
      - name: Cargo registry cache
        id: cache-1
        if: steps.out.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-home-${{ hashFiles('packages/cache_search/native/Cargo.lock') }}
          restore-keys: cargo-home-
      - name: Cargo target cache
        id: cache-2
        if: steps.out.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: packages/cache_search/native/target
          key: cargo-target-ios-${{ steps.toolchain.outputs.id }}-${{ hashFiles('packages/cache_search/native/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: cargo-target-ios-${{ steps.toolchain.outputs.id }}-${{ hashFiles('packages/cache_search/native/Cargo.lock') }}-
      - name: CoreKiwix download cache
        if: steps.out.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/libzim/libzim
          key: corekiwix-14.2.1-2
      - name: Valhalla source and dependency cache
        id: routing-cache
        if: steps.out.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/libzim/valhalla
          key: valhalla-ios-v2-${{ steps.toolchain.outputs.id }}-${{ hashFiles('packages/valhalla/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Only dependency work may fall back across recipes. Configure always
          # reruns: vcpkg recalculates ABIs and CMake regenerates target flags.
          restore-keys: |
            valhalla-ios-v2-${{ steps.toolchain.outputs.id }}-${{ hashFiles('packages/valhalla/**') }}-
            valhalla-ios-v2-${{ steps.toolchain.outputs.id }}-
      - name: Build the Rust core
        if: steps.out.outputs.cache-hit != 'true'
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: |
          rustup target add aarch64-apple-ios
          rustc --version
          xcodebuild -version
          packages/cache_search/ios/build-core.sh "$RUNNER_TEMP/libzim"
      - name: Save resumable Valhalla dependencies
        if: (always() && steps.out.outputs.cache-hit != 'true' && steps.routing-cache.outputs.cache-primary-key != '' && steps.routing-cache.outputs.cache-hit != 'true') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rel-1.1')
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/libzim/valhalla
          key: ${{ steps.routing-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-core
          path: packages/cache_search/ios/native
          retention-days: 2
      - name: Save cache (Cargo registry cache) (main and rel-1.1 only)
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rel-1.1') && steps.cache-1.outputs.cache-primary-key != '' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cache-1.outputs.cache-primary-key }}
      - name: Save cache (Cargo target cache) (main and rel-1.1 only)
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rel-1.1') && steps.cache-2.outputs.cache-primary-key != '' && steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages/cache_search/native/target
          key: ${{ steps.cache-2.outputs.cache-primary-key }}

  llama:
    needs: plan
    if: needs.plan.outputs.stage == 'all' || needs.plan.outputs.stage == 'llama'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive
      - name: Finished library cache
        id: out
        uses: actions/cache@v4
        with:
          path: packages/cache_llama/ios/native/libcache_llama_all.a
          key: llama-out-${{ hashFiles('packages/cache_llama/src/**', 'packages/cache_llama/ios/build-native.sh', 'packages/cache_llama/third_party/llama.cpp/CMakeLists.txt', 'packages/cache_llama/third_party/llama.cpp/src/**', 'packages/cache_llama/third_party/llama.cpp/ggml/src/**') }}
      - name: Build llama.cpp (Metal) and the chat engine
        if: steps.out.outputs.cache-hit != 'true'
        run: |
          cmake --version
          xcodebuild -version
          packages/cache_llama/ios/build-native.sh "$RUNNER_TEMP/llama-build"
      - uses: actions/upload-artifact@v4
        with:
          name: native-llama
          path: packages/cache_llama/ios/native/libcache_llama_all.a
          retention-days: 2

  app:
    needs: [plan, core, llama]
    if: needs.plan.outputs.stage == 'all'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: native-core
          path: packages/cache_search/ios/native
      - uses: actions/download-artifact@v4
        with:
          name: native-llama
          path: packages/cache_llama/ios/native
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rel-1.1') }}
      - name: CocoaPods cache
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods
          key: cocoapods-${{ hashFiles('app/pubspec.lock', 'app/ios/Podfile') }}
          restore-keys: cocoapods-
      # PDFium and SQLite for the app's build hooks (macOS for flutter test, iOS for the build), from the Actions cache instead of
      # GitHub releases. (PDFium for iOS is pdfium_flutter's xcframework, fetched by CocoaPods, not by these.)
      - name: PDFium and SQLite (pinned, from the Actions cache)
        # A ref from before these steps existed builds without them.
        if: hashFiles('.github/actions/pinned-downloads/action.yml') != ''
        id: native
        uses: ./.github/actions/pinned-downloads
        with:
          names: pdfium-chromium-7811-mac-arm64.tgz sqlite3-3.5.2-libsqlite3.arm64.macos.dylib sqlite3-3.5.2-libsqlite3.arm64.ios.dylib
      - name: Seed the build hooks
        if: steps.native.outcome == 'success'
        run: bash .github/scripts/seed-native-assets.sh "${{ steps.native.outputs.dir }}" app macos-arm64 ios-arm64
      - name: Flutter packages and Pods
        working-directory: app
        env:
          CACHE_READER_RULES_FILE: ${{ runner.temp }}/reader-rules.json
        run: |
          flutter --version
          flutter pub get
          flutter test --no-pub test/core_config_test.dart test/nav_speaker_test.dart test/browse/zim_download_test.dart test/browse/storage_test.dart test/browse/reader_resources_test.dart test/video_player_screen_test.dart
          cmp ../packages/cache_search/ios/tests/offline-reader-rules.json "$RUNNER_TEMP/reader-rules.json"
          flutter build ios --config-only --release --build-name=${{ needs.plan.outputs.build_name }} --build-number=${{ needs.plan.outputs.build_number }}
          cd ios && pod install
      - name: Signing certificate and profile
        env:
          P12: ${{ secrets.IOS_DIST_P12_B64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_B64 }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12" | base64 -D > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KC"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 -D > "$RUNNER_TEMP/cache.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/cache.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/cache.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "profile: $(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist") $UUID"
          if [[ "${{ inputs.carplay }}" == true ]]; then
            [[ $(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.carplay-maps' "$RUNNER_TEMP/profile.plist" 2>/dev/null) == true ]] \
              || { rm -f "$RUNNER_TEMP/profile.plist"; echo "::error::The profile does not carry the CarPlay entitlement: the car screen build cannot be signed."; exit 1; }
          fi
          rm -f "$RUNNER_TEMP/profile.plist"
      - name: Archive
        working-directory: app/ios
        run: |
          set -o pipefail
          # The car screen: CACHE_CARPLAY (NO in the project) writes Info.plist's CacheCarPlay and picks the entitlements file.
          xcodebuild archive \
            -workspace Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            CACHE_CARPLAY=${{ inputs.carplay && 'YES' || 'NO' }} \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | tail -n 60
      - name: Verify the signed archive
        run: |
          EXPECT_CARPLAY=${{ inputs.carplay }} EXPECTED_VERSION=${{ needs.plan.outputs.build_name }} EXPECTED_BUILD_NUMBER=${{ needs.plan.outputs.build_number }} bash packages/cache_search/ios/check-app.sh \
            "$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app"
      - name: Export the .ipa
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>iPhone Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>Cache App Store</string></dict>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/ipa"
          ls -l "$RUNNER_TEMP/ipa"
          mkdir -p "$GITHUB_WORKSPACE/out" && cp "$RUNNER_TEMP"/ipa/*.ipa "$GITHUB_WORKSPACE/out/Cache-${{ needs.plan.outputs.build_name }}.ipa"
      - name: Verify the actual exported IPA payload
        run: |
          test -s out/Cache-${{ needs.plan.outputs.build_name }}.ipa
          stat -f 'IPA bytes: %z' out/*.ipa
          shasum -a 256 out/*.ipa
          mkdir "$RUNNER_TEMP/ipa-check"
          unzip -q out/*.ipa -d "$RUNNER_TEMP/ipa-check"
          EXPECT_CARPLAY=${{ inputs.carplay }} EXPECTED_VERSION=${{ needs.plan.outputs.build_name }} EXPECTED_BUILD_NUMBER=${{ needs.plan.outputs.build_number }} bash packages/cache_search/ios/check-app.sh \
            "$RUNNER_TEMP/ipa-check/Payload/Runner.app"
          rm -rf "$RUNNER_TEMP/ipa-check"
      - uses: actions/upload-artifact@v4
        with:
          name: Cache-ipa
          path: out/*.ipa
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: ${{ runner.temp }}/archive.log
          retention-days: 3
      - name: Upload to TestFlight
        if: needs.plan.outputs.upload == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$ASC_KEY_P8_B64" | base64 -D > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app -f out/*.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/private_keys"

  # Every uploaded build goes to the chosen group (Public unless Family was picked). Waiting for Apple to process the upload runs
  # on Linux, not the Mac.
  public:
    needs: [plan, app]
    if: needs.plan.outputs.upload == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1
      - name: Give the build to the ${{ inputs.group || 'Public' }} testers
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
          WHATS_NEW_INPUT: ${{ inputs.whats_new }}
          GROUP: ${{ inputs.group || 'Public' }}
        run: |
          export WHATS_NEW="$WHATS_NEW_INPUT"
          python3 -I packages/cache_search/ios/testflight_public.py "${{ needs.plan.outputs.build_number }}" "$GROUP"
