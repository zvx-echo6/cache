name: cache_device
description: "Cache's battery and heat readings on Android, in every Flutter engine (the app's and WorkManager's background one)."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: co.cache.cache_device
        pluginClass: CacheDevicePlugin
