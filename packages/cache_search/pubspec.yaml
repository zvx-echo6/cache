name: cache_search
description: "Cache search core: the Rust search engine (ZIMs and libraries) behind a small Dart API."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Android and iOS (iPhone, device only: ios/build-core.sh). TODO(windows): build cache_search.dll and add `windows:
# ffiPlugin: true`. Until then the app builds on those platforms without the core and Search says it is
# not available (see README.md).
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
  # The starter layer definitions and the live data source definitions (data) the app copies to the folders the core reads them from.
  assets:
    - layers/
    - sources/
