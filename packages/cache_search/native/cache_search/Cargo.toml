[package]
name = "cache_search"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
zim = "0.5.0"
cache_tool = { path = "../cache_tool" }
# Saved places and live data live in their own crates; this crate wires them into the handle and exports their C ABI.
cache_user = { path = "../cache_user" }
cache_layers = { path = "../cache_layers" }
cache_live = { path = "../cache_live" }
serde.workspace = true
serde_json.workspace = true
thiserror = "1"
tantivy = "0.27"
html-escape = "0.3"
# Same xz2 the zim crate uses; enabling "static" (feature unification) builds liblzma into the library instead of linking liblzma.so.5.
xz2 = { version = "0.1.7", features = ["static"] }
edge = { git = "https://github.com/qdrant/qdrant", rev = "0f8c4d791a37a4946347d80486d08c168c2229f1", features = ["serverless"] }
common = { git = "https://github.com/qdrant/qdrant", rev = "0f8c4d791a37a4946347d80486d08c168c2229f1" }
shard = { git = "https://github.com/qdrant/qdrant", rev = "0f8c4d791a37a4946347d80486d08c168c2229f1", default-features = false }

# Free-space check of update_library: statvfs on unix, GetDiskFreeSpaceExW on Windows (both already in the lockfile).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
# Test-only: builds a real partial snapshot locally with Qdrant's own segment snapshot code (same rev, already in
# the lockfile through edge).
segment = { git = "https://github.com/qdrant/qdrant", rev = "0f8c4d791a37a4946347d80486d08c168c2229f1", default-features = false }
uuid = "1"

# Test-only, Windows: hard-link count and file index of a file (GetFileInformationByHandle).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
