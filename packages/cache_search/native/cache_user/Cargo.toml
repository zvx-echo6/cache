[package]
name = "cache_user"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Cache's user data in user.sqlite: saved places (Home and others), map layers and imported repeater lists"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
cache_tool = { path = "../cache_tool" }
# Map layer and repeater list files (mapdata): KML and GPX, CHIRP CSV, and the KML inside a KMZ (a zip entry inflated with
# flate2). The same three cache_live reads its XML, CSV and gzip responses with (nothing new in the lockfile).
quick-xml = "0.37"
csv = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
