[package]
name = "cache_sync"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Peer-to-peer sharing and sync between Cache devices (iroh): identity, links by code, folder sync over Wi-Fi and the internet"

[[bin]]
# The desktop peer: the same engine as the app, driven from a terminal.
name = "cache-sync"
path = "src/bin/cache_sync.rs"

[dependencies]
# Pinned to releases at least two weeks old; iroh-blobs 0.103 is the release built on iroh 1.x.
iroh = "=1.3.0"
iroh-blobs = "=0.103.1"
iroh-mdns-address-lookup = "=0.6.0"
iroh-mainline-address-lookup = "=0.6.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
n0-future = "0.3"
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
data-encoding = "2.11"
fs4 = "=1.1.0"
rand = "0.9"
url = "2"

[dev-dependencies]
tempfile = "3"
