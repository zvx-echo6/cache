[workspace]
members = ["cache_search", "cache_tool", "cache_user", "cache_live", "cache_layers", "../cli"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: object fields keep insertion order, so every JSON output has a deliberate field order
# (the order cache_search.h documents and TOOLS.md shows) instead of alphabetical.
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
