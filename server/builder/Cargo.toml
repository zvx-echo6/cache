[package]
name = "cache_builder"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Cache library builder core: PDFs to document packs (verbatim, heading-aware pieces with vectors), and packs to a normal Cache library"
# This crate lives outside the workspace root's directory (packages/cache_search/native), so it names it.
workspace = "../../packages/cache_search/native"

[lib]
name = "cache_builder"
path = "src/lib.rs"

[[bin]]
name = "cache-build"
path = "src/main.rs"

[dependencies]
# PDF text extraction (MuPDF, AGPL-3.0-or-later like Cache). 0.8.0 is the newest release at least two weeks old (2026-06-22).
# No default features: no JavaScript, Tesseract, system-font scan or Brotli (OCR comes later and will bring its own);
# base14-fonts keeps the standard 14 fonts so PDFs that do not embed Helvetica or Times still load.
mupdf = { version = "0.8.0", default-features = false, features = ["base14-fonts"] }
# The core: the blank library shard, the snapshot packer and the library check, so a built library is the one the app opens.
cache_search = { path = "../../packages/cache_search/native/cache_search" }
# The passage chunker, shared with the core (cs_pdf_chunk): one implementation.
cache_chunk = { path = "../../packages/cache_chunk" }
# The division classifier (pure Rust), for `cache-build library --classifier`; cache_embed only for the id of the embedding model
# the classifier must have been trained on.
cache_classify = { path = "../../packages/cache_classify" }
cache_embed = { path = "../../packages/cache_search/native/cache_embed" }
# The read-write shard (the same Qdrant revision as cache_search).
edge = { git = "https://github.com/qdrant/qdrant", rev = "0f8c4d791a37a4946347d80486d08c168c2229f1", features = ["serverless"] }
# PDF compression (compress.rs): the pure-Rust JPEG encoder for recompressed page images (no dependencies), and mupdf-sys for the
# object-stream flag of MuPDF's save options (the mupdf crate has no setter for it); mupdf-sys is already in the lockfile.
jpeg-encoder = { version = "0.6", default-features = false, features = ["std"] }
mupdf-sys = { version = "0.8.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
# Packs are gzip-compressed JSON Lines; the same pure-Rust flate2 as cache_search (already in the lockfile).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The source PDF's hash (the same BLAKE3 cache_sync uses).
blake3 = "1.8"
base64 = "0.22"
# SHA256SUMS of a written library folder (the same sha2 the other crates use).
sha2 = "0.10"
# Point ids (UUIDv5, docs/LIBRARY-FORMAT.md).
uuid = { version = "1", features = ["v5"] }
# Appends cache-library.json to the packed snapshot (the same tar crate cache_search uses).
tar = { version = "0.4", default-features = false }
# ZIM reader (pure Rust), the same crate and version the core uses.
zim = "0.5.0"

# The child process that reads a PDF limits its own memory (RLIMIT_AS); already in Cargo.lock.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
