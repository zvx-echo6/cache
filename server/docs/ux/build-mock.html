<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cache Build from PDFs mock</title>
<style>
/* Tokens copied from app/lib/theme.dart (cacheTokens). */
:root{--bg:#1A1D1F;--surface:#2A3036;--text:#DCC9A3;--secondary:#B0A58A;--accent:#DB8A4B;--primary:#CB7A3C;--onprimary:#1A1D1F;--emergency:#FF7A6E;--warning:#E0B45A;--ok:#8FB36A;--scrim:rgba(0,0,0,.55)}
:root[data-theme=light]{--bg:#F3EBD9;--surface:#FFFDF8;--text:#1A1D1F;--secondary:#55594F;--accent:#9C5320;--primary:#3B4D3A;--onprimary:#F3EBD9;--emergency:#B3281E;--warning:#7A5200;--ok:#3F6B2E;--scrim:rgba(26,29,31,.4)}
:root[data-theme=parchment]{--bg:#DCC9A3;--surface:#E8DBBC;--text:#1A1D1F;--secondary:#4A4638;--accent:#7E4416;--primary:#3B4D3A;--onprimary:#F3EBD9;--emergency:#9A1F16;--warning:#6E4A00;--ok:#2F5A22;--scrim:rgba(26,29,31,.4)}
:root[data-theme=tactical]{--bg:#000;--surface:#120404;--text:#E0473C;--secondary:#8E2B24;--accent:#FF5A4A;--primary:#FF5A4A;--onprimary:#000;--emergency:#FF2D1F;--warning:#C24A1E;--ok:#B23A2E;--scrim:rgba(0,0,0,.7)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:Roboto,"Segoe UI",system-ui,sans-serif;color:var(--text)}
svg{display:block;fill:currentColor}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);display:flex;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* rail */
.rail{width:80px;background:var(--surface);display:flex;flex-direction:column;align-items:center;padding-top:8px;flex:none}
.rail .lead{width:48px;height:48px;display:grid;place-items:center;color:var(--secondary);margin-bottom:8px}
.rail .dest{width:80px;height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600;color:var(--secondary)}
.rail .dest .pill{width:56px;height:32px;border-radius:16px;display:grid;place-items:center}
.rail .dest.sel{color:var(--accent)}
.rail .dest.sel .pill{background:color-mix(in srgb,var(--primary) 28%,transparent)}

/* panes */
.list{width:340px;flex:none;display:flex;flex-direction:column;border-right:1px solid color-mix(in srgb,var(--secondary) 25%,transparent);min-height:0}
.detail{flex:1;min-width:0;display:flex;justify-content:center;position:relative;min-height:0}
.detail>.page{width:640px;max-width:100%;display:flex;flex-direction:column;min-height:0}
.bar{height:56px;display:flex;align-items:center;padding:0 8px 0 16px;font-size:20px;font-weight:500;flex:none}
.bar .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:48px;height:48px;display:grid;place-items:center;border-radius:24px;color:var(--text)}
.scroll{flex:1;overflow:hidden;padding:4px 12px 16px}
.hint{font-size:12px;color:var(--secondary);padding:0 4px 8px;line-height:1.4}
.center{text-align:center;padding:24px 8px;font-size:14px;color:var(--secondary);line-height:1.45}

/* rows */
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 12px;border-radius:14px;margin-bottom:6px;position:relative}
.row.sel{background:var(--surface)}
.row .tx{flex:1;min-width:0}
.row .ti{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .de{font-size:12px;color:var(--secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .more{display:none;width:32px;height:32px;border-radius:16px;place-items:center;color:var(--secondary)}
.row.hov .more{display:grid;background:color-mix(in srgb,var(--secondary) 18%,transparent)}
.lt{width:32px;height:32px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--accent);flex:none}
.sel .lt{background:var(--bg)}
.badge{font-size:12px;border:1px solid;border-radius:10px;padding:2px 8px;white-space:nowrap;flex:none}
.card{background:var(--surface);border-radius:14px;padding:8px 4px 8px 12px;margin-bottom:6px}
.card .top{display:flex;align-items:center}
.card .tx{flex:1;min-width:0}
.card .ti{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .de{font-size:12px;color:var(--secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .de.w{color:var(--warning)}
.card .de.wrap{white-space:normal}
.nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bartrack{height:3px;margin:4px 8px 2px 0;background:color-mix(in srgb,var(--primary) 25%,transparent);border-radius:2px;overflow:hidden}
.bartrack i{display:block;height:100%;background:var(--primary)}
.tbtn{font-size:14px;font-weight:500;color:var(--accent);padding:0 12px;height:40px;display:inline-flex;align-items:center;border-radius:20px}
.notice{border-left:3px solid var(--accent)}
.notice .ti{margin-bottom:4px}
.notice li{font-size:13px;color:var(--text);margin:2px 0 2px 16px;line-height:1.4}
.notice .acts{display:flex;justify-content:flex-start;margin-left:-12px}

/* footer storage */
.foot{flex:none;padding:12px 16px 14px;border-top:1px solid color-mix(in srgb,var(--secondary) 25%,transparent)}
.foot .l1{display:flex;justify-content:space-between;font-size:12px;color:var(--secondary);margin-bottom:6px}
.foot .l1 b{font-weight:500;color:var(--text)}
.sbar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;display:flex;border:1px solid color-mix(in srgb,var(--secondary) 30%,transparent);position:relative}
.sbar .a{background:var(--accent)}.sbar .o{background:var(--secondary);opacity:.55}
.sbar .r{position:absolute;right:0;top:0;bottom:0;background:repeating-linear-gradient(45deg,transparent 0 3px,color-mix(in srgb,var(--warning) 60%,transparent) 3px 5px)}
.foot .l2{font-size:11px;color:var(--secondary);margin-top:6px;line-height:1.35}
.addwrap{padding:8px 4px 0}
.fbtn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 20px 0 16px;border-radius:20px;background:var(--primary);color:var(--onprimary);font-size:14px;font-weight:500}

/* add page */
.pg{padding:8px 16px 16px;overflow:hidden;flex:1}
.gl{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--secondary);margin:12px 4px 6px;text-transform:none}
.drop{border:2px dashed color-mix(in srgb,var(--secondary) 55%,transparent);border-radius:14px;padding:22px 20px;display:flex;align-items:center;gap:16px;background:color-mix(in srgb,var(--surface) 60%,transparent)}
.drop .tx{flex:1}.drop .ti{font-size:15px;font-weight:500}.drop .de{font-size:12px;color:var(--secondary);margin-top:2px;line-height:1.4}
.drop.err{border-color:var(--warning)}
.drop.busy{opacity:.7}
.errline{font-size:13px;color:var(--warning);padding:8px 4px 0;line-height:1.4}
.opt{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:10px 12px;margin-top:6px}
.opt .tx{flex:1}.opt .ti{font-size:15px;font-weight:500}.opt .de{font-size:12px;color:var(--secondary)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:24px;height:44px;padding:0 14px;color:var(--secondary);font-size:15px}
.chips{display:flex;gap:8px;margin:10px 0 8px}
.chip{border:1px solid color-mix(in srgb,var(--secondary) 55%,transparent);border-radius:8px;padding:5px 12px;font-size:13px;color:var(--text)}
.chip.on{background:color-mix(in srgb,var(--primary) 28%,transparent);border-color:transparent;color:var(--accent)}
.entry{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;min-height:52px;padding:6px 4px 6px 12px;margin-bottom:6px}
.entry .tx{flex:1;min-width:0}.entry .ti{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.entry .de{font-size:12px;color:var(--secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl{width:30px;height:30px;border-radius:15px;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;margin:7px}
.ring{width:44px;height:44px;display:grid;place-items:center}
.phold{flex:1;display:grid;place-items:center;font-size:15px;color:var(--secondary)}
.kv{display:flex;padding:4px 0;font-size:14px}.kv span:first-child{width:120px;color:var(--secondary)}

/* overlays */
.scrim{position:absolute;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:5}
.dlg{width:400px;background:var(--surface);border-radius:28px;padding:24px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.dlg h2{font-size:20px;font-weight:500;margin-bottom:14px;line-height:1.25}
.dlg p{font-size:15px;line-height:1.4}
.dlg .sz{display:flex;justify-content:space-between;font-size:14px;padding:2px 0}
.dlg .sm{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--secondary);margin-top:8px}
.dlg .sm span:last-child{text-align:right}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.dlg .acts .tbtn{height:40px}
.dlg .fill{background:var(--primary);color:var(--onprimary);border-radius:20px;padding:0 24px}
.dlg .fill.red{background:var(--emergency);color:var(--bg)}
.dlg .note{font-size:13px;color:var(--secondary);margin-top:8px;line-height:1.4}
.dragov{position:absolute;left:80px;right:0;top:0;bottom:0;z-index:4;background:var(--scrim);display:grid;place-items:center;padding:48px}
.dragov .box{width:100%;height:100%;border:3px dashed var(--accent);border-radius:24px;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 62%,transparent)}
.dragov .in{text-align:center;max-width:560px}
.dragov .in .big{font-size:28px;font-weight:500;margin:16px 0 8px}
.dragov .in .sub{font-size:15px;color:var(--secondary);line-height:1.45}
.snack{position:absolute;left:50%;transform:translateX(-50%);bottom:28px;background:var(--text);color:var(--bg);font-size:14px;padding:14px 20px;border-radius:8px;z-index:3;max-width:560px;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.tag{position:absolute;right:12px;top:8px;font-size:11px;color:var(--secondary);opacity:.8}
.pgs{padding:4px 16px 16px;overflow:hidden;flex:1;display:flex;flex-direction:column;min-height:0}
.inp{display:flex;align-items:center;gap:8px;height:44px;border-radius:10px;border:1.5px solid color-mix(in srgb,var(--secondary) 55%,transparent);padding:0 12px;font-size:15px;background:var(--bg)}
.inp.focus{border-color:var(--accent)}
.inp .caret{display:inline-block;width:1.5px;height:20px;background:var(--accent);margin-left:1px}
.inp .sfx{margin-left:auto;font-size:12px;color:var(--secondary)}
.choice{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:14px;padding:12px;margin-bottom:6px;border:1.5px solid transparent}
.choice.on{border-color:var(--accent)}
.choice.off{opacity:.55}
.radio{width:20px;height:20px;border-radius:10px;border:2px solid var(--secondary);flex:none;margin-top:2px;display:grid;place-items:center}
.on .radio{border-color:var(--accent)}.on .radio i{width:10px;height:10px;border-radius:5px;background:var(--accent)}
.choice .tx{flex:1;min-width:0}.choice .ti{font-size:15px;font-weight:500}.choice .de{font-size:12px;color:var(--secondary);line-height:1.4}
.drop.off{opacity:.5}
.btn2{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:20px;border:1px solid color-mix(in srgb,var(--secondary) 55%,transparent);font-size:14px;font-weight:500;color:var(--accent);flex:none}
.btn2.dis,.fbtn.dis{opacity:.45}
.note2{font-size:13px;color:var(--secondary);line-height:1.45;padding:8px 4px 0}
.prop{font-size:11px;font-weight:500;color:var(--warning);border:1px dashed var(--warning);border-radius:6px;padding:1px 6px;white-space:nowrap}
.stat{font-size:13px;color:var(--secondary);padding:0 4px 8px}
.acts2{display:flex;gap:8px;align-items:center;margin:2px 0 8px}
.acts2 .search{flex:1;height:44px}
.panel{background:var(--surface);border-radius:14px;padding:12px 12px 4px;margin-bottom:8px}
.panel .hd{display:flex;align-items:center;gap:8px}
.panel .hd .tx{flex:1;min-width:0}.panel .hd .ti{font-size:15px;font-weight:500}.panel .hd .de{font-size:12px;color:var(--secondary);line-height:1.4}
.pbar{height:6px;border-radius:3px;margin:10px 0 6px;background:color-mix(in srgb,var(--primary) 25%,transparent);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--primary)}
.pbar.paused i{background:var(--warning)}
.eta{font-size:12px;color:var(--secondary);line-height:1.4;padding-bottom:8px}
.q{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid color-mix(in srgb,var(--secondary) 20%,transparent)}
.q .tx{flex:1;min-width:0}.q .ti{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.q .de{font-size:12px;color:var(--secondary);line-height:1.35}
.q .de.w{color:var(--warning)}
.q .mb{height:3px;border-radius:2px;margin-top:5px;background:color-mix(in srgb,var(--primary) 25%,transparent);overflow:hidden}.q .mb i{display:block;height:100%;background:var(--primary)}
.q .mb.paused i{background:var(--warning)}
.q .lt{width:28px;height:28px;font-size:11px}
.q .st{font-size:12px;color:var(--secondary);white-space:nowrap}
.brow{display:flex;align-items:center;gap:12px;min-height:52px;padding:7px 12px;border-radius:14px;margin-bottom:4px;position:relative}
.brow.hov{background:var(--surface)}
.brow .tx{flex:1;min-width:0}.brow .ti{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brow .de{font-size:12px;color:var(--secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .acts3{display:none;gap:2px}.brow.hov .acts3{display:flex}
.sm32{width:32px;height:32px;border-radius:16px;display:grid;place-items:center;color:var(--secondary);background:color-mix(in srgb,var(--secondary) 18%,transparent)}
.phones{border:1px dashed color-mix(in srgb,var(--secondary) 45%,transparent);border-radius:14px;padding:10px 12px;display:flex;gap:12px;align-items:flex-start;margin-top:8px}
.phones .tx{flex:1}.phones .ti{font-size:14px;font-weight:500;color:var(--secondary);display:flex;gap:8px;align-items:center}.phones .de{font-size:12px;color:var(--secondary);line-height:1.4;margin-top:2px}
.hit{background:var(--surface);border-radius:14px;padding:10px 12px;margin-bottom:6px}
.hit .m{font-size:12px;color:var(--secondary);margin-bottom:4px}
.hit .m b{font-weight:500;color:var(--text)}
.hit p{font-size:14px;line-height:1.5}
.hit mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.fl{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid color-mix(in srgb,var(--secondary) 20%,transparent);font-size:13px}
.fl .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fl .s{color:var(--secondary);font-size:12px;width:64px;text-align:right}.fl .b{width:110px}
.ok{color:var(--ok)}
.dlg.wide{width:460px}
.dlg .drop{padding:14px;margin-top:10px}
#stage{position:absolute!important;left:0;top:0;right:0;bottom:0;width:auto!important;height:auto!important;transform:none!important}
.desk .list{width:380px}
.desk .detail>.page.wide{width:100%;max-width:1400px}
.desk .detail>.page:not(.wide){width:640px}
.cols{display:grid;grid-template-columns:minmax(380px,36%) 1fr;gap:28px;padding:4px 24px 16px;flex:1;min-height:0;overflow:hidden}
.cl,.cr{min-width:0;min-height:0;overflow:hidden}
.cr{display:flex;flex-direction:column}
.desk .bar.pb{padding-left:24px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:6px}
.grid2 .entry{margin:0}
.dz{border:2px dashed color-mix(in srgb,var(--secondary) 55%,transparent);border-radius:14px;background:color-mix(in srgb,var(--surface) 60%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:28px 24px}
.dz .ti{font-size:17px;font-weight:500}.dz .de{font-size:13px;color:var(--secondary);line-height:1.45;max-width:46ch}
.prose{max-width:70ch;font-size:14px;line-height:1.55;color:var(--secondary)}
.th,.tr{display:grid;grid-template-columns:minmax(0,1fr) 72px 92px 112px 76px;gap:12px;align-items:center;padding:0 12px}
.th{height:32px;font-size:12px;font-weight:600;color:var(--secondary);border-bottom:1px solid color-mix(in srgb,var(--secondary) 25%,transparent)}
.tr{height:46px;border-radius:10px;font-size:14px}
.tr.hov{background:var(--surface)}
.tr .c{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .n{display:flex;align-items:center;gap:10px;min-width:0;font-weight:500}.tr .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .s{color:var(--secondary)}.tr .num,.th .num{text-align:right}
.tr .a{display:flex;gap:2px;justify-content:flex-end;visibility:hidden}.tr.hov .a{visibility:visible}
.lt.sm{width:26px;height:26px;font-size:11px;border-radius:7px}
.hits{max-width:72ch}
.chip{white-space:nowrap}.chips{flex-wrap:wrap}
.sw{width:44px;height:26px;border-radius:13px;background:var(--primary);position:relative;flex:none}.sw i{position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:10px;background:var(--onprimary)}
.tr3{display:grid;grid-template-columns:minmax(0,1.5fr) 110px minmax(0,1.7fr);gap:12px;align-items:center;padding:8px 12px;font-size:13px;border-top:1px solid color-mix(in srgb,var(--secondary) 18%,transparent)}
.tr3.h{font-size:12px;font-weight:600;color:var(--secondary);padding:0 12px;height:32px;border-top:0;border-bottom:1px solid color-mix(in srgb,var(--secondary) 25%,transparent)}
.tr3 .s{color:var(--secondary)}.tr3 .f{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.banner{border-radius:14px;padding:10px 12px;margin-bottom:8px;border-left:3px solid var(--warning);background:var(--surface);font-size:13px;line-height:1.45}
.banner b{display:block;font-size:15px;font-weight:500;margin-bottom:2px}
.fld{margin:2px 0 4px}
.frow{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:10px 12px;margin-bottom:6px}
.frow .tx{flex:1;min-width:0}.frow .ti{font-size:15px;font-weight:500}.frow .de{font-size:12px;color:var(--secondary);line-height:1.4;word-break:break-all}
.crumb{font-size:13px;color:var(--secondary);padding:4px 0 8px}
.dlg.wide{width:480px}
.tree{background:var(--surface);border-radius:14px;padding:8px 12px;margin-top:8px;font-size:13px}
.tree div{display:flex;gap:10px;padding:3px 0;line-height:1.4}.tree b{font-family:ui-monospace,monospace;font-weight:500;width:84px;flex:none;color:var(--accent)}.tree span{color:var(--secondary)}
.tr4{display:grid;grid-template-columns:34px minmax(0,1.5fr) 96px minmax(0,2fr) 84px;gap:12px;align-items:center;padding:7px 12px;font-size:13px;border-top:1px solid color-mix(in srgb,var(--secondary) 18%,transparent)}
.tr4.h{font-size:12px;font-weight:600;color:var(--secondary);height:32px;padding-top:0;padding-bottom:0;border-top:0;border-bottom:1px solid color-mix(in srgb,var(--secondary) 25%,transparent)}
.tr4 .tbtn{white-space:nowrap}.tr4 .s{color:var(--secondary)}.tr4 .f{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tr4 .num{text-align:right}
.flow{display:flex;align-items:center;gap:6px}.flow .fb{background:var(--surface);border-radius:10px;padding:8px 14px;font-family:ui-monospace,monospace;font-size:13px;display:flex;flex-direction:column}.flow .fb small{font-family:Roboto,sans-serif;font-size:11px;color:var(--secondary)}.flow .fb.w{border-left:3px solid var(--warning)}.flow .ar{color:var(--secondary)}
.art{padding:8px 32px 24px;overflow:hidden;flex:1;font-size:16px;line-height:1.6}

<div id="stage"></div>
<script>
const P = {

 note:'M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z',

  back:"M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z",
  edit:"M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z",
  retry:"M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z",
  pdf:"M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6z",

  del:"M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z",
  chev:"M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z",
  upload:'M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z'
};
const Q = new URLSearchParams(location.search);
const THEME = Q.get('theme') || 'dark';
const STATE = Q.get('state') || 'entry';
document.documentElement.dataset.theme = THEME;
const ic = (n, s=24) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
const DESK = innerWidth>=1280 && Q.get('class')!=='tablet';
document.getElementById('stage').classList.toggle('desk',DESK);
const GB = n => n.toFixed(1) + ' GB';
const LIBNAME = 'Hunting and field guides';
const PROP = '<span class="prop">Proposed, not approved</span>';

/* ---------- device list (as approved) ---------- */
let disk = {total:500, other:331.3, reserve:20};
const base = [
 {t:'Wikipedia (English)', d:'All articles, no images', s:'98.2 GB', k:'zim'},
 {t:'WikiMed', d:'Medical encyclopedia', s:'2.1 GB', k:'zim'},
 {t:'Survival and preparedness guides', d:'Appropedia and field manuals', s:'4.8 GB', k:'zim'},
 {t:'Field Notes Library', d:'Your own · 212 entries', s:'612 MB', k:'own'},
 {t:'Cache Field Guide', d:'Built in · 96 entries', s:'18 MB', k:'own'}
];
let libSize = 98.2+2.1+4.8+.612+.018;

const row = (r, o={}) => {
 let badge = r.badge ? `<span class="badge" style="color:${r.bc||'var(--secondary)'}">${r.badge}</span>` : '';
 const detail=[r.d,r.s].filter(Boolean).join(' · ');
 return `<div class="row ${o.sel?'sel':''} ${o.hov?'hov':''}"><div class="lt">${r.t[0].toUpperCase()}</div><div class="tx"><div class="ti">${r.t}</div><div class="de">${detail}</div></div>${badge}<div class="more">${ic('more',20)}</div></div>`;
};
const bar = f => `<div class="bartrack"><i style="width:${f*100}%"></i></div>`;
const card = (title, line, o={}) => `<div class="card"><div class="top"><div class="tx"><div class="ti">${title}</div><div class="de ${o.warn?'w':''}" style="${o.wrap?'white-space:normal':''}">${line}</div></div>${o.btn||''}${o.noX?'':`<div class="ib" style="width:44px;height:44px">${ic('close',22)}</div>`}</div>${o.f!=null?bar(o.f):''}</div>`;
const pauseBtn = `<div class="ib" style="width:44px;height:44px">${ic('pause',22)}</div>`;
const playBtn = `<div class="ib" style="width:44px;height:44px;color:var(--accent)">${ic('play',22)}</div>`;

function footer(o={}){
 const free = disk.total - disk.other - libSize + (o.freeAdj||0);
 const aw = libSize/disk.total*100, ow = disk.other/disk.total*100, rw = disk.reserve/disk.total*100;
 return `<div class="foot"><div class="l1"><span>Device storage</span><span><b>${GB(free)}</b> free of ${disk.total} GB</span></div>
 <div class="sbar"><span class="a" style="width:${aw}%"></span><span class="o" style="width:${ow}%"></span><span class="r" style="width:${rw}%"></span></div>
 <div class="l2">Library ${GB(libSize)} · Other files ${GB(disk.other)}<br>Cache keeps ${disk.reserve} GB free for the device${o.pending?`<br><span style="color:var(--warning)">${o.pending}</span>`:''}</div></div>`;
}
function listPane({hint, top='', rows, sel, hov, pending, adjFree, rowsHtml}){
 const items = rowsHtml!==undefined ? rowsHtml : rows.map((r,i)=>row(r,{sel:sel===i,hov:hov===i})).join('');
 return `<div class="list"><div class="bar"><span class="t">Library</span><div class="ib">${ic('menuopen',24)}</div></div>
 <div class="scroll">${hint?`<div class="hint">${hint}</div>`:''}${top}${items}
 <div class="addwrap"><button class="fbtn">${ic('add',18)}Add to Library</button></div></div>${footer({pending, freeAdj:adjFree})}</div>`;
}
/* the built library as a row in the device list; position 3 so the list reads like the approved one */
const built = (badge, bc, d='Built from your PDFs · 214 books', s='1.9 GB') => ({t:LIBNAME, d, s, badge, bc, k:'own'});
const withBuilt = (b, at=3) => { const r=[...base]; r.splice(at,0,b); return r; };

/* ---------- detail: shared pieces ---------- */
const barTitle = (t, o={}) => `<div class="bar">${o.back?`<div class="ib" style="margin-left:-8px">${ic('back',24)}</div>`:''}<span class="t">${t}</span>${o.more?`<div class="ib">${ic('more',24)}</div>`:''}</div>`;
const dropBox = ({off, text, sub}) => `<div class="drop ${off?'off':''}"><div style="color:var(--accent)">${ic('upload',32)}</div><div class="tx"><div class="ti">${text||'Drop PDFs or a folder here'}</div><div class="de">${sub||'Folders are searched for PDFs, including inside other folders. You can add more at any time.'}</div></div>
 <div style="display:flex;flex-direction:column;gap:6px;flex:none"><span class="btn2 ${off?'dis':''}">Choose PDFs</span><span class="btn2 ${off?'dis':''}">Choose a folder</span></div></div>`;

/* ---------- ENTRY: Add to Library ---------- */
function addPage({model=true}){
 if(DESK) return deskAddPage({model});
 const sub = model ? 'Make a searchable library from PDF files on this computer.' : 'Needs the search model first (630 MB).';
 return `<div class="page">${barTitle('Add to Library')}<div class="pg">
 <div class="gl">From this computer</div>
 <div class="drop"><div style="color:var(--accent)">${ic('upload',32)}</div><div class="tx"><div class="ti">Drop a file here</div><div class="de">A .zim file, a .cache-library file or a library snapshot. Files of several GB are fine.</div></div><button class="fbtn" style="flex:none">Choose a file</button></div>
 <div class="gl">Your own</div>
 <div class="opt"><div style="color:var(--text)">${ic('book',22)}</div><div class="tx"><div class="ti">Your own library</div><div class="de">From a file or a download link</div></div><div style="color:var(--secondary)">${ic('chev',24)}</div></div>
 <div class="opt" style="border:1.5px solid var(--accent)"><div style="color:var(--text)">${ic('pdf',22)}</div><div class="tx"><div class="ti">Build from your PDFs</div><div class="de">${sub}</div></div>${model?'':'<span class="badge" style="color:var(--warning)">Needs search model</span>'}<div style="color:var(--secondary)">${ic('chev',24)}</div></div>
 <div class="note2" style="padding-top:6px">Dropping PDFs anywhere on Library opens this too.</div>
 ${dropRow(STATE==='ingest-active')}
 <div class="gl">Ready-made collections · free from Kiwix</div>
 <div class="search">${ic('search',20)}Search the catalogue</div>
 <div class="chips"><span class="chip">All languages</span><span class="chip on">All</span><span class="chip">Medicine</span><span class="chip">Preparedness</span></div>
 <div class="entry"><div class="lt">W</div><div class="tx"><div class="ti">Wikipedia (English)</div><div class="de">All articles, no images · 98.2 GB</div></div><span class="badge" style="color:var(--ok);margin-right:8px">On this device</span></div>
 </div></div>`;
}

/* ---------- BUILD page ---------- */
function destination({pick='new', name='', focus=true, nameErr}){
 const n = pick==='new';
 return `<div class="gl">1 · Where should the books go?</div>
 <div class="choice ${n?'on':''}"><div class="radio">${n?'<i></i>':''}</div><div class="tx"><div class="ti">A new library</div><div class="de" style="margin-bottom:8px">Give it a name you will recognise on your phone.</div>
  ${n?`<div class="inp ${focus?'focus':''}">${name?`<span>${name}</span>`:'<span style="color:var(--secondary)">Library name</span>'}${focus?'<span class="caret"></span>':''}</div>${nameErr?`<div class="errline" style="padding:6px 0 0">${nameErr}</div>`:''}`:''}</div></div>
 <div class="choice ${!n?'on':''}"><div class="radio">${!n?'<i></i>':''}</div><div class="tx"><div class="ti">A library you built</div><div class="de">${n?'Add to one you made from PDFs earlier.':''}</div>
  ${!n?`<div class="inp" style="margin-top:8px"><span>${LIBNAME}</span><span class="sfx">214 books</span></div>`:`<div class="de" style="margin-top:2px">${LIBNAME} · 214 books<br>Garden and homestead · 38 books</div>`}</div></div>`;
}
function buildPage({mode, model=true, name=''}){
 if(DESK) return deskBuildPage({name});
 const body = `${destination({name, focus: !!name && mode!=='gated'})}
 <div class="gl">2 · Add your PDFs</div>${dropBox({off: !name})}
 <div class="note2">Each PDF is cut into passages of about 200 words, keeping the real page and heading, so answers can quote the book. Building takes about a second per passage on a desktop computer and longer on a small device: a 300-page book is roughly 8 to 10 minutes. Scanned pages are read as images and take longer. It keeps going if you close this tab.</div>`;
 return `<div class="page">${barTitle('Build from your PDFs',{back:true})}<div class="pg">${body}</div></div>`;
}
function gatedPage(kind){ // kind: 'idle' | 'downloading' | 'failed'
 let card;
 if(kind==='idle') card = `<div class="panel" style="padding-bottom:12px;border-left:3px solid var(--accent)"><div class="ti" style="font-size:15px;font-weight:500">Building needs the search model</div>
  <div class="de" style="font-size:13px;color:var(--secondary);line-height:1.45;margin:4px 0 10px">Cache uses it to read each passage so your phone can find it later. Download it once, 630 MB. It stays on this device and works with no internet.</div>
  <div class="sm" style="display:flex;justify-content:space-between;font-size:12px;color:var(--secondary);margin-bottom:12px"><span>Device storage</span><span>58.4 GB free, needs 630 MB</span></div>
  <div style="display:flex;gap:8px;align-items:center"><span class="fbtn">${ic('dl',18)}Download search model</span><span class="note2" style="padding:0">It keeps downloading if you close this tab.</span></div></div>`;
 else if(kind==='downloading') card = `<div class="panel" style="padding-bottom:10px;border-left:3px solid var(--accent)"><div class="hd"><div class="tx"><div class="ti">Downloading the search model</div><div class="de">412 MB of 630 MB · 38 MB/s · about 6 seconds left</div></div>${pauseBtn}<div class="ib" style="width:44px;height:44px">${ic('close',22)}</div></div>
  <div class="pbar"><i style="width:65%"></i></div><div class="eta">You can pick a library name and choose PDFs while this finishes. Building starts as soon as it is done.</div></div>`;
 else card = `<div class="panel" style="padding-bottom:12px;border-left:3px solid var(--warning)"><div class="ti" style="font-size:15px;font-weight:500">The search model did not download</div>
  <div class="de" style="font-size:13px;color:var(--warning);line-height:1.45;margin:4px 0 10px">The connection failed: reset by peer. 412 MB of 630 MB were kept.</div>
  <div style="display:flex;gap:8px;align-items:center"><span class="fbtn">${ic('retry',18)}Try again</span></div></div>`;
 const gate = kind==='downloading';
 return `<div class="page">${barTitle('Build from your PDFs',{back:true})}<div class="pg">${card}
  <div style="${gate?'':'opacity:.5'}">${destination({name: gate?LIBNAME:'', focus:gate})}
  <div class="gl">2 · Add your PDFs</div>${dropBox({off:!gate, text: gate?'Drop PDFs or a folder here':'Drop PDFs or a folder here', sub: gate?'They upload now. Building waits for the search model.':'Available once the search model is on this device.'})}</div></div></div>`;
}
function uploadingPage(){
 const files = [
  ['Edible Wild Plants of the Intermountain West.pdf','48.2 MB',1],
  ['Field Manual 21-76 Survival.pdf','12.9 MB',1],
  ['Wilderness Medicine Handbook, 7th ed.pdf','63.0 MB',.62],
  ['Backcountry Navigation Basics.pdf','21.4 MB',.18],
 ];
 const fl = files.map(f=>`<div class="fl"><span class="${f[2]===1?'ok':''}" style="width:20px">${f[2]===1?ic('check',18):''}</span><span class="n">${f[0]}</span><span class="b"><div class="bartrack" style="margin:0;${f[2]===1?'opacity:.4':''}"><i style="width:${f[2]*100}%"></i></div></span><span class="s">${f[1]}</span></div>`).join('');
 return `<div class="page">${barTitle('Build from your PDFs',{back:true})}<div class="pg">
 <div class="kv"><span>Going to</span><span>${LIBNAME} (new library)</span></div>
 <div class="panel" style="margin-top:8px"><div class="hd"><div class="tx"><div class="ti">Uploading 214 PDFs</div><div class="de">63 of 214 done · 1.9 GB of 3.1 GB · 52 MB/s · about 4 min left</div></div><span class="tbtn">Cancel</span></div>
  <div class="pbar"><i style="width:61%"></i></div>
  <div class="eta">Keep this tab open until the upload ends. Building starts on the first book and carries on without this tab.</div></div>
 <div class="gl">Uploading now</div><div class="panel" style="padding:2px 12px 4px">${fl.replace('border-top','border-top:0;x')}</div>
 <div class="note2">Found in the folder: 214 PDFs. 2 other files were left out (notes.txt, cover.jpg).</div>
 </div></div>`;
}

/* ---------- LIBRARY page ---------- */
const BOOKS = [
 ['Field Manual 21-76 Survival','412 pages','480 passages','just now'],
 ['Edible Wild Plants of the Intermountain West','236 pages','311 passages','12 min ago'],
 ['Where There Is No Doctor','512 pages','702 passages','1 h ago'],
 ['mushrooms_demystified_2nd_ed_OCR','560 pages','644 passages','1 h ago'],
 ['Knots, Splices and Rope Work','188 pages','203 passages','2 h ago'],
 ['Idaho Hunting Regulations 2025','96 pages','141 passages','2 h ago'],
];
function booksList({n=5, hov=-1, edit=-1, show=BOOKS}){
 return show.slice(0,n).map((b,i)=>{
  if(i===edit) return `<div class="brow hov" style="background:var(--surface);flex-wrap:wrap;align-items:flex-start;padding:10px 12px"><div class="lt" style="margin-top:2px">${b[0][0]}</div><div class="tx" style="flex:1">
   <div class="inp focus" style="height:40px"><span>Mushrooms Demystified</span><span class="caret"></span></div>
   <div class="de" style="margin-top:6px;white-space:normal;line-height:1.4">This PDF has no title inside it, so the file name is used: mushrooms_demystified_2nd_ed_OCR.pdf</div>
   <div style="display:flex;gap:4px;margin:8px 0 0 -12px;align-items:center"><span class="tbtn">Use file name</span><span style="flex:1"></span><span class="tbtn">Cancel</span><span class="tbtn" style="background:var(--primary);color:var(--onprimary)">Save</span></div>
   <div class="de" style="margin-top:2px">Only this title changes. The passages are not rebuilt.</div></div></div>`;
  return `<div class="brow ${hov===i?'hov':''}"><div class="lt">${b[0][0]}</div><div class="tx"><div class="ti">${b[0]}</div><div class="de">${b[1]} · ${b[2]} · added ${b[3]}</div></div>
  <div class="acts3"><div class="sm32" title="Edit title">${ic('edit',18)}</div><div class="sm32" title="More">${ic('more',18)}</div></div></div>`; }).join('');
}
const qrow = (o) => `<div class="q"><div class="lt">${o.t[0]}</div><div class="tx"><div class="ti">${o.t}</div><div class="de ${o.warn?'w':''}">${o.line}</div>${o.f!=null?`<div class="mb ${o.paused?'paused':''}"><i style="width:${o.f*100}%"></i></div>`:''}</div>${o.btn||''}</div>`;
const RET = `<span class="tbtn">${''}Retry</span>`;
const DISM = `<span class="tbtn" style="color:var(--secondary)">Dismiss</span>`;

function queuePanel(kind){
 // kind: run | paused | failed | reopened
 const paused = kind==='paused';
 const active = paused
  ? qrow({t:'Wilderness Medicine Handbook, 7th ed', line:'Paused · building passages · 212 of 480', f:.44, paused:true})
  : qrow({t:'Wilderness Medicine Handbook, 7th ed', line:'Building passages · 212 of 480', f:.44});
 const ocr = qrow({t:'Backcountry Navigation Basics', line:'Scanned book. Reading the pages as images (OCR) · page 118 of 340', f:.35});
 const rows = [];
 if(kind==='failed'){
  rows.push(active);
  rows.push(qrow({t:'Trapping Fur-bearers, 1952 scan.pdf', line:'This PDF is protected with a password. Remove the password and add it again, or retry.', warn:true, btn:RET+DISM}));
  rows.push(qrow({t:'ch03_final_v2.pdf', line:'The file is damaged and could not be opened.', warn:true, btn:RET+DISM}));

  const t = card('Building '+LIBNAME, '2 PDFs from the drop folder · 18 of 214 books · roughly 9 to 13 h left', {f:18/214, btn:pauseBtn, wrap:true, noX:true});
  L = listPane({hint:'Building keeps going if you close this tab.', top:t, rows:withBuilt(built('1 to decide','var(--warning)','Built from your PDFs · 18 books','160 MB'))}); D = dropFolderPage('active'); break; }
 case 'removed':
  L = listPane({hint:normalHint, rows:withBuilt(built(null))}); D = dropFolderPage('active'); over = removedDlg(); break;
 case 'library-classes':
  L = clsListPane({}); D = clsPage('classes'); break;
 case 'library-division':
  L = clsListPane({open:'800', sel:'830'}); D = clsPage('division'); break;
 case 'unsorted-place':
  L = clsListPane({uns:true}); D = clsPage('unsorted'); over = placeDlg(); break;
 case 'library-page':
  L = listPane({hint:normalHint, rows:withBuilt(built(null)), sel:3}); D = libPage({mode:'ready', n:6}); break;
 case 'library-search':
  L = listPane({hint:normalHint, rows:withBuilt(built(null)), sel:3}); D = libPage({mode:'search'}); break;
 case 'library-empty':
  L = listPane({hint:normalHint, rows:withBuilt(built(null,null,'Built from your PDFs · 0 books','0 MB')), sel:3}); D = libPage({mode:'empty'}); break;
 case 'edit-title':
  L = listPane({hint:normalHint, rows:withBuilt(built(null)), sel:3}); D = libPage({mode:'edit', n:5}); break;
 case 'replace':
  L = listPane({hint:normalHint, rows:withBuilt(built(null)), sel:3}); D = libPage({mode:'remove', n:6});
  over = dlg(`<h2>Replace Where There Is No Doctor with a newer edition?</h2>
   <p>Choose the new PDF. Only this book is rebuilt. The current one stays searchable until the new one is ready, then it is swapped in.</p>
   ${dropBox({text:'Drop the new PDF here', sub:'One PDF.'}).replace(/<div style="display:flex;flex-direction:column[^]*$/,'<span class="btn2" style="flex:none">Choose a PDF</span></div>')}
   <div class="acts"><span class="tbtn">Cancel</span></div>`, 'wide'); break;
 case 'remove-confirm': {
  L = listPane({hint:normalHint, rows:withBuilt(built(null)), sel:3, hov:3}); D = libPage({mode:'remove', n:6});
  const f = disk.total-disk.other-libSize-1.9;
  over = dlg(`<h2>Remove Where There Is No Doctor from ${LIBNAME}?</h2><div class="sz"><span>Frees</span><span>38 MB · 702 passages</span></div>
   <div class="sm"><span>Device storage</span><span>${GB(f)} free now, ${GB(f+.038)} after</span></div>
   <p class="note">Only this book is removed. The rest of the library is not touched. Your PDF on this computer is not deleted. To get it back, add the PDF again.</p>
   <div class="acts"><span class="tbtn">Cancel</span><span class="tbtn fill red">Remove</span></div>`); break; }
 case 'no-model':
  L = listPane({hint:normalHint, rows:base}); D = gatedPage('idle'); break;
 case 'model-downloading': {
  const t = card('Search model', 'Downloading · 412 MB of 630 MB', {f:.65, btn:pauseBtn});
  L = listPane({hint:'Downloads keep going if you close this tab.', top:t, rows:base, adjFree:-.4});
  D = gatedPage('downloading'); over = snack('Download started. It keeps downloading if you close this tab.'); break; }
 case 'model-failed':
  L = listPane({hint:normalHint, rows:base}); D = gatedPage('failed'); break;
}
const stage = document.getElementById('stage');
stage.innerHTML = rail + L + `<div class="detail" style="${STATE==='reader-full-window'?'justify-content:stretch':''}">${D}</div>` + over;
function fit(){ const s=Math.min(innerWidth/1920, innerHeight/1080); stage.style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();
</script>
