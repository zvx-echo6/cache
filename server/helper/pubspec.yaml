name: cache_core_helper
description: "Cache for Linux's Dart helper: runs the app's core dispatcher over stdin/stdout for the Rust server."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.12.2

# The helper reads the Flutter-free sources of packages/cache_search by relative path (that package depends on the Flutter
# SDK, so it cannot be a pub dependency). Versions match app/pubspec.lock.
dependencies:
  ffi: ^2.1.3
  http: ^1.6.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.31.0
