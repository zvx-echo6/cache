[package]
name = "cache_server"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Cache Server: one HTTPS port serving the browser app and proxying its core calls to a supervised Dart helper, behind a single password"
# This crate lives outside the workspace root's directory (packages/cache_search/native), so it names it.
workspace = "../packages/cache_search/native"

[lib]
name = "cache_server"
path = "src/lib.rs"

[[bin]]
name = "cache-server"
path = "src/main.rs"

# A stand-in for the Dart helper, used only by the proxy tests (tests/proxy.rs); it is not installed.
[[bin]]
name = "fake-helper"
path = "testbin/fake_helper.rs"
test = false

[dependencies]
# The embedder loader (libloading + cl_embed settings shared with the cs command line and the places pack builder); workspace member.
cache_embed = { path = "../packages/cache_search/native/cache_embed" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "signal", "process", "io-util", "sync", "fs"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# The ring provider only: the aws-lc-rs default would pull in a C build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.14"
ring = "0.17"
subtle = "2"
# The one outbound HTTP client of the Cache core crates (cache_live, cache_layers, cache_regions, ...): blocking, rustls with the
# bundled web roots. Used for the library downloads and the catalogue fetch proxy; already in Cargo.lock.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
base64 = "0.22"
# The library builder (PDFs to packs, packs to a shard) and the BLAKE3 of each PDF; both already in Cargo.lock.
cache_builder = { path = "builder" }
blake3 = "1.8"
# Security keys (WebAuthn). 0.5.5 is the newest stable release at least two weeks old (0.6.2 is a day old). The feature lets a
# key sign in with one touch (user presence) instead of also demanding a PIN.
webauthn-rs = { version = "0.5.5", features = ["danger-user-presence-only-security-keys"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# webauthn-rs 0.5 uses OpenSSL. On Linux it is built from source and linked statically, so the installed server needs no libssl.
# (On Windows it comes from vcpkg instead: see server/README.md.)
[target.'cfg(not(windows))'.dependencies]
openssl = { version = "0.10.81", features = ["vendored"] }
