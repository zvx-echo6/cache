[package]
name = "cache_server"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Cache Server: one HTTPS port serving the browser app and the core's search and read calls, behind a single password"
# This crate lives outside the workspace root's directory (packages/cache_search/native), so it names it.
workspace = "../packages/cache_search/native"

[lib]
name = "cache_server"
path = "src/lib.rs"

[[bin]]
name = "cache-server"
path = "src/main.rs"

[dependencies]
cache_search_cli = { path = "../packages/cache_search/cli" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "signal"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# The ring provider only: the aws-lc-rs default would pull in a C build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.14"
ring = "0.17"
subtle = "2"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
